name: Integracion y entrega continua Alma Floral

on:
  push:
    branches:
      - develop
      - ci/integracion-continua
      - cd/paquete-publicacion
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-y-publicar:
    name: Validar y preparar entrega
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v7

      - name: Preparar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore tests/AlmaFloral.Web.Tests/AlmaFloral.Web.Tests.csproj

      - name: Compilar aplicacion y pruebas
        run: dotnet build tests/AlmaFloral.Web.Tests/AlmaFloral.Web.Tests.csproj --configuration Release --no-restore

      - name: Ejecutar pruebas automatizadas
        run: dotnet test tests/AlmaFloral.Web.Tests/AlmaFloral.Web.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Preparar aplicacion para entrega
        run: dotnet publish src/AlmaFloral.Web/AlmaFloral.Web.csproj --configuration Release --no-build --output artifacts/publicacion

      - name: Guardar paquete descargable
        uses: actions/upload-artifact@v7
        with:
          name: alma-floral-publicacion-${{ github.run_number }}
          path: artifacts/publicacion/
          archive: true
          if-no-files-found: error
          retention-days: 30
